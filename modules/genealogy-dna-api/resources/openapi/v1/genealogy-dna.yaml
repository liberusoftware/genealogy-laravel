openapi: 3.1.0
info: {title: Genealogy DNA API, version: 1.0.0}
paths:
  /api/v1/genealogy/dna/kits:
    get: {operationId: genealogy.dna.kits.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.dna.kits.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KitInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/kits/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.dna.kits.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.dna.kits.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KitInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.dna.kits.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
  /api/v1/genealogy/dna/kits/{kit}/consent:
    post: {operationId: genealogy.dna.kits.consent, security: [{sanctum: []}], parameters: [{name: kit, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/kits/{kit}/revoke:
    post: {operationId: genealogy.dna.kits.revoke, security: [{sanctum: []}], parameters: [{name: kit, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevokeInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/matches:
    get: {operationId: genealogy.dna.matches.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.dna.matches.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MatchInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/matches/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.dna.matches.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.dna.matches.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MatchInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.dna.matches.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
  /api/v1/genealogy/dna/matches/{record}/segments:
    post: {operationId: genealogy.dna.matches.segment, security: [{sanctum: []}], parameters: [{name: record, in: path, required: true, schema: {type: string, format: uuid}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SegmentInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/groups:
    get: {operationId: genealogy.dna.groups.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.dna.groups.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/dna/groups/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.dna.groups.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.dna.groups.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.dna.groups.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    KitInput: {type: object, properties: {person_id: {type: string, format: uuid}, provider: {type: string}, external_id: {type: string}, status: {type: string}, metadata: {type: object}}}
    ConsentInput: {type: object, required: [scope], properties: {scope: {type: string, maxLength: 100}, policy_version: {type: string, nullable: true}}}
    RevokeInput: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 1000}}}
    MatchInput: {type: object, required: [kit_id, external_id], properties: {kit_id: {type: string, format: uuid}, external_id: {type: string}, display_name: {type: string, nullable: true}, predicted_relationship: {type: string, nullable: true}, confidence: {type: integer, minimum: 0, maximum: 100}, total_cm: {type: number, minimum: 0}, shared_segments: {type: integer, minimum: 0}, status: {type: string}, is_private: {type: boolean}, notes: {type: string, nullable: true}, metadata: {type: object}}}
    SegmentInput: {type: object, required: [chromosome, start_position, end_position], properties: {chromosome: {type: integer, minimum: 1, maximum: 99}, start_position: {type: integer, minimum: 0}, end_position: {type: integer, minimum: 0}, centimorgans: {type: number, minimum: 0}, snps: {type: integer, minimum: 0}, side: {type: string, nullable: true}, metadata: {type: object}}}
    GroupInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}, description: {type: string, nullable: true}, status: {type: string}, metadata: {type: object}}}
    Resource: {type: object, required: [data], properties: {data: {type: object}}}
  responses:
    Resource: {description: DNA resource, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
    Collection: {description: Paginated DNA resources, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
