components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    KitInput: {type: object, properties: {person_id: {type: string, format: uuid}, provider: {type: string}, provider_id: {type: string, format: uuid}, external_id: {type: string}, status: {type: string}, metadata: {type: object}}}
    ProviderInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}, slug: {type: string, maxLength: 255}, status: {type: string, enum: [active, inactive]}, website: {type: string, format: uri, nullable: true}, metadata: {type: object, nullable: true}}}
    ValidationInput: {type: object, required: [content], properties: {content: {type: string, description: DNA file content is validated in memory and never persisted by this operation}}}
    ImportInput: {type: object, required: [content, name], properties: {content: {type: string, description: Raw DNA content is encrypted before it is persisted}, name: {type: string}, provider_id: {type: string, format: uuid}, provider: {type: string}, external_id: {type: string}, metadata: {type: object}}}
    ConsentInput: {type: object, required: [scope], properties: {scope: {type: string, maxLength: 100}, policy_version: {type: string, nullable: true}}}
    RevokeInput: {type: object, required: [reason], properties: {reason: {type: string, maxLength: 1000}}}
    MatchInput: {type: object, required: [kit_id, external_id], properties: {kit_id: {type: string, format: uuid}, external_id: {type: string}, display_name: {type: string, nullable: true}, predicted_relationship: {type: string, nullable: true}, confidence: {type: integer, minimum: 0, maximum: 100}, total_cm: {type: number, minimum: 0}, shared_segments: {type: integer, minimum: 0}, status: {type: string}, is_private: {type: boolean}, notes: {type: string, nullable: true}, metadata: {type: object}}}
    AnalyzeInput: {type: object, required: [kit_a, kit_b], properties: {kit_a: {type: object, description: Normalized chromosome-to-position genotype map}, kit_b: {type: object, description: Normalized chromosome-to-position genotype map}}}
    CompareInput: {type: object, required: [kit_a, kit_b], properties: {kit_a: {type: string, format: uuid, description: Consented imported kit identifier}, kit_b: {type: string, format: uuid, description: Consented imported kit identifier}}}
    TriangulateInput: {type: object, required: [matches], properties: {matches: {type: array, minItems: 3, items: {type: object, required: [id, segments], properties: {id: {type: string}, segments: {type: array, items: {type: object, required: [chromosome, start, end], properties: {chromosome: {type: string}, start: {type: integer, minimum: 0}, end: {type: integer, minimum: 0}}}}}}}, minimum_shared_cm: {type: number, minimum: 0, default: 20}}}
    SegmentInput: {type: object, required: [chromosome, start_position, end_position], properties: {chromosome: {type: integer, minimum: 1, maximum: 99}, start_position: {type: integer, minimum: 0}, end_position: {type: integer, minimum: 0}, centimorgans: {type: number, minimum: 0}, snps: {type: integer, minimum: 0}, side: {type: string, nullable: true}, metadata: {type: object}}}
    GroupInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}, description: {type: string, nullable: true}, status: {type: string}, metadata: {type: object}}}
    NoteInput: {type: object, required: [noteable_type, noteable_id, body], properties: {noteable_type: {type: string}, noteable_id: {type: string, format: uuid}, body: {type: string, maxLength: 50000}}}
    RelationshipInput: {type: object, required: [match_id, person_id, relationship_type], properties: {match_id: {type: string, format: uuid}, person_id: {type: string, format: uuid}, relationship_type: {type: string}, confidence: {type: integer, minimum: 0, maximum: 100}, status: {type: string, enum: [proposed, confirmed, rejected]}, rationale: {type: string, nullable: true}, metadata: {type: object}}}
    Resource: {type: object, required: [data], properties: {data: {type: object}}}
  responses:
    Resource: {description: DNA resource, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
    Collection: {description: Paginated DNA resources, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
