openapi: 3.1.0
info: {title: Genealogy People API, version: 1.0.0}
paths:
  /api/v1/genealogy/people:
    get: {operationId: genealogy.people.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.people.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PersonInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/people/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.people.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.people.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PersonInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.people.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  schemas:
    PersonInput: {type: object, required: [given_name], properties: {given_name: {type: string, maxLength: 255}, family_name: {type: string, nullable: true}, display_name: {type: string, nullable: true}, sex: {type: string, enum: [M, F, U, X], nullable: true}, aliases: {type: array, items: {type: string}}, attributes: {type: object}, birth_date: {type: string, format: date, nullable: true}, death_date: {type: string, format: date, nullable: true}, is_public: {type: boolean}}}
    Resource: {type: object, required: [id, type, attributes], properties: {id: {type: string}, type: {type: string, const: genealogy-people}, attributes: {$ref: '#/components/schemas/PersonInput'}}}
  responses:
    Resource: {description: Authorized person, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Resource'}}}}}}
    Collection: {description: Paginated authorized people, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Resource'}}, meta: {type: object}}}}}}
