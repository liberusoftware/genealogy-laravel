openapi: 3.1.0
info: {title: Genealogy Import Export API, version: 1.0.0}
paths:
  /api/v1/genealogy/import-export:
    get: {operationId: genealogy.importExport.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.importExport.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/import-export/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.importExport.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.importExport.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.importExport.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
  /api/v1/genealogy/import-export/preview:
    post: {operationId: genealogy.importExport.preview, security: [{sanctum: []}], requestBody: {$ref: '#/components/requestBodies/ImportPayload'}, responses: {'200': {description: Parsed import preview}}}
  /api/v1/genealogy/import-export/import:
    post: {operationId: genealogy.importExport.import, security: [{sanctum: []}], requestBody: {$ref: '#/components/requestBodies/ImportPayload'}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/import-export/export:
    get: {operationId: genealogy.importExport.export, security: [{sanctum: []}], responses: {'200': {description: GEDCOM download, content: {text/plain: {schema: {type: string}}}}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  requestBodies:
    ImportPayload: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}, name: {type: string}}}}, application/json: {schema: {type: object, required: [content], properties: {content: {type: string, maxLength: 10485760}, name: {type: string}}}}}}
  schemas:
    TransferInput: {type: object, required: [name, format, direction], properties: {name: {type: string, maxLength: 255}, status: {type: string}, format: {type: string, enum: [gedcom, gramps-xml]}, direction: {type: string, enum: [import, export]}, metadata: {type: object}}}
  responses:
    Resource: {description: Data transfer resource, content: {application/json: {schema: {type: object, properties: {data: {type: object}}}}}}
    Collection: {description: Paginated transfers, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
