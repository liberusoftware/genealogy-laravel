openapi: 3.1.0
info: {title: Genealogy Import Export API, version: 1.0.0}
paths:
  /api/v1/genealogy/import-export:
    get: {operationId: genealogy.importExport.list, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Collection'}}}
    post: {operationId: genealogy.importExport.create, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/import-export/{record}:
    parameters: [{name: record, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: genealogy.importExport.get, security: [{sanctum: []}], responses: {'200': {$ref: '#/components/responses/Resource'}}}
    patch: {operationId: genealogy.importExport.update, security: [{sanctum: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}, responses: {'200': {$ref: '#/components/responses/Resource'}}}
    delete: {operationId: genealogy.importExport.delete, security: [{sanctum: []}], responses: {'204': {description: Deleted}}}
  /api/v1/genealogy/import-export/{record}/undo:
    parameters: [{name: record, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {operationId: genealogy.importExport.undo, security: [{sanctum: []}], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: {'200': {$ref: '#/components/responses/Resource'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/v1/genealogy/import-export/preview:
    post: {operationId: genealogy.importExport.preview, security: [{sanctum: []}], requestBody: {$ref: '#/components/requestBodies/ImportPayload'}, responses: {'200': {description: Parsed import preview}}}
  /api/v1/genealogy/import-export/import:
    post: {operationId: genealogy.importExport.import, security: [{sanctum: []}], requestBody: {$ref: '#/components/requestBodies/ImportPayload'}, responses: {'201': {$ref: '#/components/responses/Resource'}}}
  /api/v1/genealogy/import-export/export:
    get: {operationId: genealogy.importExport.export, security: [{sanctum: []}], parameters: [{name: format, in: query, schema: {type: string, enum: [gedcom, gedcom-7, gedcom-x, gramps-xml], default: gedcom}}, {name: name, in: query, schema: {type: string, maxLength: 255}}], responses: {'200': {description: Genealogy export download, headers: {X-Data-Transfer-ID: {schema: {type: string, format: uuid}}, X-Data-Transfer-Status: {schema: {type: string, const: completed}}}, content: {text/plain: {schema: {type: string}}, application/json: {schema: {type: string}}, application/xml: {schema: {type: string}}}}}}
components:
  securitySchemes: {sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: string}}
  requestBodies:
    ImportPayload: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}, name: {type: string}}}}, application/json: {schema: {type: object, required: [content], properties: {content: {type: string, maxLength: 10485760}, name: {type: string}}}}}}
  schemas:
    TransferInput: {type: object, required: [name, format, direction], properties: {name: {type: string, maxLength: 255}, status: {type: string, enum: [draft, active, completed, failed, rolled_back]}, format: {type: string, enum: [gedcom, gedcom-7, gedcom-x, gramps-xml]}, direction: {type: string, enum: [import, export]}, metadata: {type: object}}}
  responses:
    Resource: {description: Data transfer resource, content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {id: {type: string}, type: {type: string, const: genealogy-data-transfer}, attributes: {$ref: '#/components/schemas/TransferInput'}}}}}}}}
    Collection: {description: Paginated transfers, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}}}}
    Problem: {description: RFC 9457 Problem Details, content: {application/problem+json: {schema: {type: object, required: [type, title, status, detail], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, detail: {type: string}, instance: {type: string, format: uri}}}}}}
