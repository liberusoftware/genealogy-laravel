name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit dependencies
        run: composer audit --locked

      - name: Check formatting
        run: vendor/bin/pint --test

      # phpstan.neon existed and was configured at level 9 while nothing ever
      # ran it. Scope and level are explained in that file.
      - name: Static analysis
        # The default CLI limit is too small for Laravel's generated type
        # graph. Keep the gate enabled and give PHPStan enough memory to
        # complete instead of treating a worker crash as a passing check.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Generate application key
        run: php artisan key:generate

      # The threshold measures app/ alone — the host's five composition classes. Package
      # coverage is each package's own gate, against its own phpunit.xml (§3.10).
      - name: Run tests
        run: php artisan test --coverage-clover=coverage.xml --min=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
